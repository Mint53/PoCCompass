[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv", ".python_packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# prompt text is natural language; wrapping it changes what the model sees
"app/services/*prompts.py" = ["E501"]
